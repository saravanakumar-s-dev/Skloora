<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skloora - Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .header {
            width: 100%;
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 30px;

            background: linear-gradient(
                90deg,
                #0f172a,
                #1e293b
            );

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .logo-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #00d4ff;

            border-radius: 12px;

            margin-right: 12px;

            box-shadow:
                0 0 15px #00d4ff;
        }

        .logo-icon span {
            font-size: 21px;
            font-weight: bold;
            color: #0f172a;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;

            letter-spacing: 1px;

            color: white;
        }

        .brand span {
            color: #00d4ff;

            text-shadow:
                0 0 10px #00d4ff;
        }

        .profile-title {
            text-align: center;

            margin: 35px 0 25px;

            font-size: 28px;
            font-weight: 700;

            color: #111827;
        }

        .profile-container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            padding: 0 15px 50px;
        }

        .profile-card {
            width: 100%;

            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .profile-picture {
            width: 160px;
            height: 160px;

            margin: 0 auto 20px;

            border-radius: 50%;

            overflow: hidden;

            background: #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 4px solid #00d4ff;

            box-shadow:
                0 0 15px rgba(0, 212, 255, 0.35);
        }

        .profile-picture img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-placeholder {
            font-size: 55px;
            color: #6b7280;
        }

        .profile-name {
            margin: 10px 0 5px;

            font-size: 23px;
            font-weight: 700;

            color: #111827;
        }

        .profile-description {
            margin: 0 0 25px;

            font-size: 14px;

            color: #6b7280;
        }

        .upload-label {
            display: block;

            margin-bottom: 8px;

            text-align: left;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        .file-input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #f9fafb;

            cursor: pointer;

            font-size: 14px;
        }

        .file-input:hover {
            border-color: #00d4ff;
        }

        .save-btn {
            width: 100%;

            margin-top: 18px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .save-btn:hover {
            background: #00d4ff;

            color: #0f172a;

            transform: translateY(-1px);
        }

        .result {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #374151;

            font-size: 14px;

            word-break: break-word;
        }

        .back-btn {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 18px;

            border-radius: 9px;

            background: white;

            border: 1px solid #d1d5db;

            color: #111827;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #f3f4f6;

            transform: scale(1.03);
        }

        @media (max-width: 700px) {

            .header {
                padding: 0 15px;
            }

            .brand {
                font-size: 24px;
            }

            .profile-title {
                font-size: 24px;

                margin-top: 25px;
            }

            .profile-container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .profile-card {
                padding: 20px;

                border-radius: 12px;
            }

            .profile-picture {
                width: 130px;
                height: 130px;
            }

            .profile-placeholder {
                font-size: 45px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo-icon">
        <span>S</span>
    </div>

    <div class="brand">
        Sk<span>loora</span>
    </div>

</header>


<!-- TITLE -->

<h1 class="profile-title">
    My Profile
</h1>


<!-- PROFILE -->

<div class="profile-container">

    <div class="profile-card">


        <!-- CURRENT PROFILE PICTURE -->

        <div class="profile-picture">

            <!--
                Replace this with your actual profile-image
                Thymeleaf path when you implement GET profile.
            -->

            <div class="profile-placeholder">
                👤
            </div>

        </div>


        <h2 class="profile-name">
            My Profile
        </h2>

        <p class="profile-description">
            Update your Skloora profile picture
        </p>


        <!-- UPLOAD FORM -->

        <form
                th:action="@{/profile/update}"
                method="post"
                enctype="multipart/form-data">


            <label
                    class="upload-label"
                    for="profileImage">

                Select Profile Picture

            </label>


            <input
                    class="file-input"
                    type="file"
                    id="profileImage"
                    name="profileImage"
                    accept="image/*"
                    required>


            <button
                    class="save-btn"
                    type="submit">

                Save Profile Picture

            </button>

        </form>

            <h2>
        <a th:href="@{/auth/changePassword}">Change Password</a>
    </h2>


        <!-- RESULT FROM CONTROLLER -->

        <div
                class="result"
                th:if="${result != null}"
                th:text="${result}">

            Result

        </div>


        <!-- BACK -->

        <a
                class="back-btn"
                href="/">

            Back

        </a>


    </div>

</div>


<script>

    const fileInput =
        document.getElementById("profileImage");

    const profilePicture =
        document.querySelector(".profile-picture");


    fileInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            alert("Please select an image file.");

            this.value = "";

            return;
        }


        const reader = new FileReader();

        reader.onload = function (event) {

            profilePicture.innerHTML = "";

            const img =
                document.createElement("img");

            img.src = event.target.result;

            img.alt = "Profile Picture";

            profilePicture.appendChild(img);

        };

        reader.readAsDataURL(file);

    });

</script>


</body>

</html>
