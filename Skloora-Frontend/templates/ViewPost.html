<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Skloora Feed</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #111827;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            width: 100%;
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 30px;

            background: linear-gradient(
                90deg,
                #0f172a,
                #1e293b
            );

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.25);
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #00d4ff;

            border-radius: 12px;

            margin-right: 12px;

            box-shadow:
                0 0 15px #00d4ff;
        }


        .logo-icon span {
            font-size: 21px;
            font-weight: bold;

            color: #0f172a;
        }


        .brand {
            font-size: 28px;
            font-weight: 800;

            letter-spacing: 1px;

            color: white;
        }


        .brand span {
            color: #00d4ff;

            text-shadow:
                0 0 10px #00d4ff;
        }


        /* ================================
           PAGE TITLE
        ================================= */

        .feed-title {
            text-align: center;

            margin: 30px 0 25px;

            font-size: 28px;
            font-weight: 700;

            color: #111827;
        }


        /* ================================
           FEED CONTAINER
        ================================= */

        .feed {
            width: 100%;

            max-width: 700px;

            margin-left: auto;
            margin-right: auto;

            padding-left: 15px;
            padding-right: 15px;
            padding-bottom: 50px;
        }


        /* ================================
           POST
        ================================= */

        .post {
            width: 100%;

            background: white;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }


        /* ================================
           USER
        ================================= */

        .post-user {
            margin: 0;

            font-size: 17px;
            font-weight: 700;

            color: #111827;

            word-break: break-word;
        }


        /* ================================
           DESCRIPTION
        ================================= */

        .post-text {
            margin-top: 10px;
            margin-bottom: 16px;

            font-size: 15px;

            line-height: 1.5;

            color: #374151;

            word-break: break-word;
        }


        /* ================================
           MEDIA CONTAINER
        ================================= */

        .media-container {
            width: 100%;

            margin-top: 10px;
            margin-bottom: 15px;

            overflow: hidden;

            border-radius: 12px;

            background: #000;
        }


        /* ================================
           IMAGE
        ================================= */

        .media-container img {
            display: block;

            width: 100% !important;
            max-width: 100% !important;

            height: auto;

            max-height: 550px;

            object-fit: contain;

            margin: 0 auto;
        }


        /* ================================
           VIDEO
        ================================= */

        .media-container video {
            display: block;

            width: 100% !important;
            max-width: 100% !important;

            height: auto;

            max-height: 550px;

            margin: 0 auto;
        }


        /* ================================
           NO MEDIA
        ================================= */

        .no-media {
            display: none;
        }


        /* ================================
           POST BOTTOM
        ================================= */

        .post-bottom {
            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-top: 12px;

            border-top: 1px solid #e5e7eb;
        }


        /* ================================
           DATE
        ================================= */

        .post-date {
            font-size: 12px;

            color: #6b7280;
        }


        /* ================================
           LIKE
        ================================= */

        .like-area {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .like-btn {
            width: 42px !important;
            height: 38px;

            margin: 0 !important;
            padding: 0 !important;

            display: flex;

            align-items: center;
            justify-content: center;

            background: white;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 19px;

            cursor: pointer;

            transition: 0.2s;
        }


        .like-btn:hover {
            background: #f3f4f6;

            transform: scale(1.05);
        }


        .like-count {
            min-width: 20px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 15px;
            }


            .brand {
                font-size: 24px;
            }


            .feed-title {
                font-size: 24px;

                margin-top: 25px;
            }


            .feed {
                padding-left: 10px;
                padding-right: 10px;
            }


            .post {
                padding: 15px;

                border-radius: 12px;
            }

        }

    </style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<div class="header">

    <div class="logo-icon">
        <span>SK</span>
    </div>

    <div class="brand">
        <span>Sk</span>loora
    </div>

</div>


<!-- =================================
     TITLE
================================= -->

<h2 class="feed-title">
    Skloora Feed
</h2>


<!-- =================================
     FEED
================================= -->

<div class="feed">

    <!-- POST -->

    <div class="post"
         th:each="post : ${posts}">


        <!-- USER -->

        <h3 class="post-user"
            th:text="${post.post_by}">
            username
        </h3>


        <!-- DESCRIPTION -->

        <p class="post-text"
           th:text="${post.post_des}">
            Post description
        </p>


        <!-- =================================
             MEDIA
        ================================= -->

        <div class="media-container"
             th:if="${post.path != null and !post.path.isEmpty()}">

            <!-- IMAGE -->

            <img th:if="${post.media_type == 'img'}"
                 th:src="@{${post.path}}"
                 alt="Post image"
                 loading="lazy"
                 onerror="this.style.display='none';">


            <!-- VIDEO -->

            <video th:if="${post.media_type == 'video'}"
                   controls
                   preload="metadata">

                <source th:src="@{${post.path}}">

                Your browser does not support video.

            </video>

        </div>


        <!-- =================================
             DATE + LIKE
        ================================= -->

        <div class="post-bottom">


            <!-- DATE -->

            <div class="post-date"
                 th:text="${post.post_date}">
                2026-08-13
            </div>


            <!-- LIKE -->

            <div class="like-area">

                <button
                    class="like-btn"
                    type="button"
                    onclick="likePost(this)">
                    🤍
                </button>

                <span class="like-count">
                    0
                </span>

            </div>


        </div>


    </div>

</div>


<!-- =================================
     JAVASCRIPT
================================= -->

<script>


function getPostId(postElement) {

    return postElement.querySelector(".post-user").innerText
        +
        postElement.querySelector(".post-text").innerText;
}


function likePost(button) {

    const post = button.closest(".post");

    const countElement =
        post.querySelector(".like-count");

    const postId =
        getPostId(post);


    let likesDB =
        JSON.parse(
            localStorage.getItem("likesDB") || "{}"
        );


    let isLiked =
        likesDB[postId]?.liked || false;


    let count =
        likesDB[postId]?.count ??
        parseInt(
            countElement.innerText || "0"
        );


    if (!isLiked) {

        isLiked = true;

        count++;

        button.innerText = "❤️";

    }

    else {

        isLiked = false;

        count = Math.max(
            0,
            count - 1
        );

        button.innerText = "🤍";

    }


    likesDB[postId] = {

        liked: isLiked,

        count: count

    };


    localStorage.setItem(
        "likesDB",
        JSON.stringify(likesDB)
    );


    countElement.innerText = count;

}


window.onload = function () {

    let likesDB =
        JSON.parse(
            localStorage.getItem("likesDB") || "{}"
        );


    document
        .querySelectorAll(".post")
        .forEach(post => {

            const postId =
                getPostId(post);


            const data =
                likesDB[postId];


            if (data) {

                const btn =
                    post.querySelector(".like-btn");

                const countEl =
                    post.querySelector(".like-count");


                countEl.innerText =
                    data.count;


                if (data.liked) {

                    btn.innerText = "❤️";

                }

            }

        });

};


</script>


</body>

</html>
